# ============================================================
# Nginx Configuration — WIGO Herbal
# File: /etc/nginx/sites-available/wigo-herbal
#
# After copying:
#   sudo ln -s /etc/nginx/sites-available/wigo-herbal \
#              /etc/nginx/sites-enabled/wigo-herbal
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then get SSL certificate:
#   sudo certbot --nginx -d wigoherbal.com -d www.wigoherbal.com
# ============================================================

# ── Redirect HTTP → HTTPS ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name wigoherbal.com www.wigoherbal.com;

    # Let's Encrypt / Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Redirect www → non-www (HTTPS) ──────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wigoherbal.com;

    ssl_certificate     /etc/letsencrypt/live/wigoherbal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wigoherbal.com/privkey.pem;

    return 301 https://wigoherbal.com$request_uri;
}

# ── Main HTTPS Server ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wigoherbal.com;

    # ── SSL Certificates (managed by Certbot) ────────────────
    ssl_certificate     /etc/letsencrypt/live/wigoherbal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wigoherbal.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ─────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/wigo-herbal-access.log;
    error_log  /var/log/nginx/wigo-herbal-error.log warn;

    # ── Gzip Compression ─────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript image/svg+xml;

    # ── Static Asset Caching ─────────────────────────────────
    location ~* \.(css|js|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_cache_bypass $http_upgrade;
        expires    30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Block access to sensitive files ──────────────────────
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    location ~ /(node_modules|backend/scripts)/ {
        deny all;
        return 404;
    }

    # ── Proxy all requests to Node.js ────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Upload size limit (for service images)
        client_max_body_size   5M;
    }
}
